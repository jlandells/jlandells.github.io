name: Update Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write          # trimmed — this job only commits, it doesn't deploy

jobs:
  update-license-year:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v5

    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'jlandells@users.noreply.github.com'

    - name: Update Copyright Year
      run: |
        current_year=$(date +"%Y")
        sed -Ei "s/(Copyright \&copy; )([0-9]{4})(-[0-9]{4})?,/\1\2-$current_year,/" _pages/LICENSE.md
        echo "current_year=$current_year" >> "$GITHUB_ENV"

    - name: Commit changes if there are any
      run: |
        git diff --exit-code --quiet _pages/LICENSE.md || (git add _pages/LICENSE.md && git commit -m "Update copyright year to $current_year" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
